<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">El modelo de caja de CSS</title>
  <desc id="desc">Cuatro capas, de fuera hacia dentro: margin (margen), border (borde), padding (relleno) y content (contenido).</desc>

  <!-- Fondo de tarjeta (se ve bien en modo claro y oscuro) -->
  <rect x="0" y="0" width="720" height="470" rx="12" fill="#ffffff"/>

  <!-- MARGIN -->
  <rect x="20" y="20" width="680" height="380" fill="#fbd5ad" stroke="#e08a2e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="36" y="42" font-size="15" font-weight="bold" fill="#8a4b0f">MARGIN · margen</text>
  <text x="36" y="61" font-size="12" fill="#8a4b0f">Espacio exterior entre la caja y sus vecinos. Es transparente: no toma el color de fondo.</text>

  <!-- BORDER -->
  <rect x="70" y="70" width="580" height="280" fill="#37474f"/>
  <text x="84" y="87" font-size="13" font-weight="bold" fill="#ffffff">BORDER · borde<tspan font-weight="normal" font-size="12">   La línea que rodea la caja (grosor, estilo y color)</tspan></text>

  <!-- PADDING -->
  <rect x="94" y="94" width="532" height="232" fill="#c5e8b7"/>
  <text x="110" y="116" font-size="15" font-weight="bold" fill="#2e6b1f">PADDING · relleno</text>
  <text x="110" y="135" font-size="12" fill="#2e6b1f">Espacio interior entre el contenido y el borde. Sí toma el color de fondo.</text>

  <!-- CONTENT -->
  <rect x="144" y="144" width="432" height="132" fill="#a9cdef" stroke="#2f6fb0" stroke-width="1"/>
  <text x="360" y="203" font-size="16" font-weight="bold" fill="#123e6b" text-anchor="middle">CONTENT · contenido</text>
  <text x="360" y="226" font-size="12" fill="#123e6b" text-anchor="middle">Texto, imágenes… Su tamaño es width × height</text>


  <!-- Leyenda inferior: orden y cálculo -->
  <text x="360" y="428" font-size="13" fill="#333333" text-anchor="middle">De fuera hacia dentro: <tspan font-weight="bold" fill="#8a4b0f">margin</tspan> → <tspan font-weight="bold" fill="#37474f">border</tspan> → <tspan font-weight="bold" fill="#2e6b1f">padding</tspan> → <tspan font-weight="bold" fill="#123e6b">content</tspan></text>
  <text x="360" y="452" font-size="12" fill="#555555" text-anchor="middle">Ancho que ocupa = width + padding (izq. + der.) + border (izq. + der.) + margin (izq. + der.)</text>
</svg>
