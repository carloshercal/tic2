<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>

  <header class="site-header">
    <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
  </header>

  <main class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>{{ site.title }} — Contenido de consulta. Las tareas y entregas evaluables se gestionan en Microsoft Teams.</p>
  </footer>

</body>
</html>
